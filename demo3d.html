<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Demo 3D sin cámara</title>
  <style>
    body { margin: 0; background: #0f1115; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
    nav { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; }
    nav a { padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,.55); color: #fff; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<nav>
  <a href="?el=tierra">🌿 Tierra</a><a href="?el=fuego">🔥 Fuego</a><a href="?el=agua">💧 Agua</a><a href="?el=aire">🌪️ Aire</a><a href="?dos=1">🌉 Dos personas</a><a href="?abrazo=1">🤗 Abrazo</a><a href="editor.html" target="_blank">🛠️ Editor</a>
</nav>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
// Demo sin cámara: una persona simulada (silueta + esqueleto) para ver y presentar los reinos 3D.
// Parámetros: ?el=tierra|fuego|agua|aire  &s=escala  &feet=altura de los pies  &ring=tamaño  &t=segundos de calentamiento
import { Realms } from "./world3d.js";
const q = new URLSearchParams(location.search);
const el = q.get("el") || "tierra";
const warm = parseFloat(q.get("t") || "8");
const ring = parseFloat(q.get("ring") || "2.2");
const W = 1280, H = 720, cx = 640;
const c = document.getElementById("c"), ctx = c.getContext("2d");
window.onerror = (m) => { document.title = "error: " + m; };

// ?dos=1: dos personas que se agarran de la mano cada tanto (se forma el puente entre sus reinos)
// ?abrazo=1: dos personas que se abrazan cada tanto (sus reinos se fusionan en un mundo único)
const abrazo = q.get("abrazo") === "1";
const dos = q.get("dos") === "1" || abrazo;
const el2 = q.get("el2") || (el === "fuego" ? "agua" : "fuego");
const ps = parseFloat(q.get("s") || (dos ? "0.55" : "0.7")), feetY = parseFloat(q.get("feet") || "600");

// Esqueleto de una persona centrada en x0. reach = -1/1 estira el brazo de ese lado hacia el otro
function makeBody(x0, reach = 0, hug = 0) {
  const b = Array.from({ length: 33 }, () => ({ x: 0, y: 300, v: 1 }));
  const set = (i, x, y) => (b[i] = { x, y, v: 1 });
  set(0, 0, 150);
  set(11, 70, 235); set(12, -70, 235); set(13, 100, 340); set(14, -100, 340); set(15, 112, 440); set(16, -125, 420);
  set(23, 45, 450); set(24, -45, 450); set(25, 50, 560); set(26, -50, 560); set(27, 50, 662); set(28, -50, 662);
  if (reach > 0) { set(13, 190, 300); set(15, 300, 330); set(19, 320, 332); }   // brazo derecho (x+) estirado
  if (reach < 0) { set(14, -190, 300); set(16, -300, 330); set(20, -320, 332); } // brazo izquierdo (x-) estirado
  // Abrazo (hug = lado donde está la otra persona): un brazo por encima del hombro y otro por la cintura del otro
  if (hug > 0) { set(13, 130, 290); set(15, 235, 240); set(19, 245, 236); set(14, 40, 380); set(16, 200, 410); set(20, 212, 414); }
  if (hug < 0) { set(14, -130, 290); set(16, -235, 240); set(20, -245, 236); set(13, -40, 380); set(15, -200, 410); set(19, -212, 414); }
  for (const p of b) { p.x = x0 + p.x * ps; p.y = feetY + (p.y - 665) * ps; }
  return b;
}
const gap = 300 * ps * 2 + 10; // con los brazos estirados las manos se tocan en el centro
const people = dos
  ? [{ x0: cx - gap / 2, el, reach: 1, hugX: cx - 55 * ps, side: 1 }, { x0: cx + gap / 2, el: el2, reach: -1, hugX: cx + 55 * ps, side: -1 }]
  : [{ x0: cx, el, reach: 0 }];
for (const P of people) {
  P.open = makeBody(P.x0, 0);
  P.held = abrazo ? makeBody(P.hugX, 0, P.side) : makeBody(P.x0, P.reach);
  P.heldX = abrazo ? P.hugX : P.x0;
}

function drawPerson(g, sx, sy, fill, body, x0) {
  g.save(); g.scale(sx, sy); g.fillStyle = g.strokeStyle = fill; g.lineCap = "round"; g.lineJoin = "round";
  const L = (a, b, w) => { g.lineWidth = w * ps; g.beginPath(); g.moveTo(body[a].x, body[a].y); g.lineTo(body[b].x, body[b].y); g.stroke(); };
  g.beginPath(); g.arc(body[0].x, body[0].y + 5 * ps, 42 * ps, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.moveTo(body[11].x + 10, body[11].y - 5); g.lineTo(body[12].x - 10, body[12].y - 5); g.lineTo(body[24].x - 12, body[24].y + 10); g.lineTo(body[23].x + 12, body[23].y + 10); g.fill();
  L(11, 13, 40); L(13, 15, 34); L(12, 14, 40); L(14, 16, 34); L(23, 25, 48); L(25, 27, 40); L(24, 26, 48); L(26, 28, 40);
  g.lineWidth = 30 * ps; g.beginPath(); g.moveTo(x0, body[0].y + 40 * ps); g.lineTo(x0, body[11].y); g.stroke();
  g.restore();
}
function makeMask(held) {
  const m = document.createElement("canvas"); m.width = 256; m.height = 256;
  for (const P of people) drawPerson(m.getContext("2d"), 256 / W, 256 / H, "rgba(0,0,0,1)", held ? P.held : P.open, held ? P.heldX : P.x0);
  return m;
}
const masks = { true: makeMask(true), false: makeMask(false) };

const realms = new Realms(); window.realms = realms;
await realms.load();
realms.setSize(W, H, 12);
const tracks = people.map((P, i) => ({ id: i + 1, x: P.x0, y: feetY, w: 150 * ps, body: P.open, alpha: 1, element: P.el }));
const opts = { shadow: true, light: true, ringSize: ring, revealTime: parseFloat(q.get("aparicion") || "6") }; // ?aparicion= segundos hasta verse nítido
// Ciclo de la demo con dos personas: agarrados 12 s, sueltos 5 s (?ciclo=0 = siempre agarrados)
const cycle = q.get("ciclo") === "0" ? 0 : 17;
const isHeld = (t) => dos && (!cycle || t % cycle < 12);
let simT = 0;
const step = (dt) => {
  simT += dt;
  const held = isHeld(simT);
  people.forEach((P, i) => { tracks[i].body = held ? P.held : P.open; tracks[i].x = held ? P.heldX : P.x0; });
  realms.update(dt, tracks, opts);
  return held;
};
for (let i = 0; i < warm * 30; i++) step(1 / 30); // que el reino ya haya crecido

const bg = ctx.createLinearGradient(0, 0, 0, H);
bg.addColorStop(0, "#6b6f78"); bg.addColorStop(0.62, "#8a8d94"); bg.addColorStop(0.63, "#5a4a3c"); bg.addColorStop(1, "#3a2e24");
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const held = step(dt);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  for (const P of people) drawPerson(ctx, 1, 1, "#3d5a80", held ? P.held : P.open, held ? P.heldX : P.x0);
  ctx.drawImage(realms.render(masks[held]), 0, 0);
  document.title = "done " + realms.status + " puentes:" + (realms.bridgeCount || 0) + " fusiones:" + (realms.fusionCount || 0);
  // Nombre del mundo fusionado
  ctx.font = "600 30px system-ui, sans-serif"; ctx.textAlign = "center";
  for (const f of realms.fusionLabels()) {
    ctx.globalAlpha = Math.min(1, f.alpha * 1.5); ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,0.6)";
    ctx.strokeText(`${f.emoji} ${f.name}`, f.x, f.y + 110); ctx.fillStyle = f.color; ctx.fillText(`${f.emoji} ${f.name}`, f.x, f.y + 110);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
