<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minimundos Elementales</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Minimundos Elementales</h1>
    <span id="status" class="badge badge-wait">Cargando modelo…</span>
  </header>

  <div class="toolbar">
    <label>Cámara <select id="cameraSelect"><option value="">(automática)</option></select></label>
    <button id="refreshBtn" title="Buscar cámaras conectadas">⟳ Buscar cámaras</button>
    <button id="startBtn" class="primary">Iniciar cámara</button>
    <label class="filebtn" title="Usar un video grabado en lugar de la cámara">🎞️ Cargar video<input type="file" id="videoFile" accept="video/*" hidden /></label>
    <button id="pauseBtn" disabled>⏸ Pausa</button>
    <label title="Velocidad del video cargado">Velocidad
      <select id="speed" disabled>
        <option value="1" selected>1×</option>
        <option value="0.5">0.5×</option>
        <option value="0.25">0.25×</option>
      </select>
    </label>
    <label>Calidad
      <select id="quality">
        <option value="auto" selected>Automática</option>
        <option value="2">Alta</option>
        <option value="1">Media</option>
        <option value="0">Baja</option>
      </select>
    </label>
    <button id="snapBtn" disabled>Capturar PNG</button>
    <button id="fsToolbarBtn" title="Ver el minimundo en pantalla completa (F)">⛶ Pantalla completa</button>
    <a href="editor.html" target="_blank" class="filebtn" title="Diseñar los pueblos a mano">🛠️ Editor de pueblos</a>
    <span class="fps">FPS: <span id="fps">0</span></span>
  </div>
  <p id="errorMsg" class="error"></p>
  <p id="infoMsg" class="info"></p>

  <main>
    <section>
      <h2>Cámara en vivo</h2>
      <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <div class="placeholder" id="ph1">Pulsa <b>Iniciar cámara</b></div>
      </div>
    </section>

    <section>
      <h2>Minimundo</h2>
      <div class="stage checker" id="worldStage">
        <canvas id="output"></canvas>
        <button id="fsBtn" class="fs-btn" title="Pantalla completa (F · doble clic)">⛶ Pantalla completa</button>
        <div class="placeholder" id="ph2">Aquí aparecerás con tu minimundo</div>
      </div>
    </section>

    <aside class="panel">
      <fieldset>
        <legend>Fondo</legend>
        <label><input type="radio" name="bg" value="original" checked /> Original (sin quitar)</label>
        <label><input type="radio" name="bg" value="transparent" /> Transparente</label>
        <label><input type="radio" name="bg" value="blur" /> Desenfoque</label>
        <label><input type="radio" name="bg" value="color" /> Color sólido</label>
        <label><input type="radio" name="bg" value="image" /> Imagen</label>
        <input type="color" id="bgColor" value="#00b140" />
        <input type="file" id="bgImage" accept="image/*" />
      </fieldset>

      <fieldset>
        <legend>Ajustes</legend>
        <label>Umbral <input type="range" id="threshold" min="0.1" max="0.9" step="0.05" value="0.5" /></label>
        <label>Transición <input type="range" id="softness" min="0.05" max="0.5" step="0.05" value="0.3" /></label>
        <label>Difuminado <input type="range" id="feather" min="0" max="40" step="1" value="14" /></label>
        <label>Estabilidad <input type="range" id="smoothing" min="0" max="0.9" step="0.1" value="0.5" /></label>
        <label><input type="checkbox" id="showBox" checked /> Recuadro de persona</label>
        <label><input type="checkbox" id="mirror" checked /> Modo espejo</label>
      </fieldset>

      <fieldset>
        <legend>Reino elemental</legend>
        <label><input type="checkbox" id="showRing" checked /> Mostrar reino</label>
        <label><input type="checkbox" id="showLabel" checked /> Nombre del elemento</label>
        <label><input type="checkbox" id="showShadow" checked /> Sombra en el piso</label>
        <label><input type="checkbox" id="showLight" checked /> Iluminación ambiental</label>
        <label><input type="checkbox" id="showJoints" /> Ver puntos de los pies</label>
        <button id="shuffleBtn">🎲 Cambiar elementos</button>
        <label>Tamaño <input type="range" id="ringSize" min="0.8" max="4" step="0.1" value="2.2" /></label>
        <label>Inclinación cámara <input type="range" id="ringTilt" min="0" max="30" step="1" value="12" /></label>
      </fieldset>

      <fieldset>
        <legend>Diagnóstico</legend>
        <pre id="diag">—</pre>
      </fieldset>
    </aside>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
